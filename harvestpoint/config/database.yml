# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", ENV.fetch("PGPORT", 5432)) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
<% if ENV["DB_PASSWORD"].present? %>
  password: <%= ENV["DB_PASSWORD"] %>
<% end %>

development:
  <<: *default
  database: harvestpoint_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: harvestpoint_test

# Production configuration supporting both direct environment variables and DATABASE_URL
# Ideal for AWS RDS, EC2 with Docker Compose, and ECS / App Runner.
production:
  primary: &primary_production
<% if ENV["DATABASE_URL"].present? %>
    url: <%= ENV["DATABASE_URL"] %>
<% else %>
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "harvestpoint_production") %>
    username: <%= ENV.fetch("DB_USERNAME", "harvestpoint") %>
    password: <%= ENV["DB_PASSWORD"] || ENV["HARVESTPOINT_DATABASE_PASSWORD"] %>
<% end %>
  cache:
<% if ENV["CACHE_DATABASE_URL"].present? %>
    url: <%= ENV["CACHE_DATABASE_URL"] %>
<% else %>
    <<: *primary_production
    database: <%= ENV.fetch("CACHE_DB_NAME", ENV.fetch("DB_NAME", "harvestpoint_production")) %>
<% end %>
    migrations_paths: db/cache_migrate
  queue:
<% if ENV["QUEUE_DATABASE_URL"].present? %>
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
<% else %>
    <<: *primary_production
    database: <%= ENV.fetch("QUEUE_DB_NAME", ENV.fetch("DB_NAME", "harvestpoint_production")) %>
<% end %>
    migrations_paths: db/queue_migrate
  cable:
<% if ENV["CABLE_DATABASE_URL"].present? %>
    url: <%= ENV["CABLE_DATABASE_URL"] %>
<% else %>
    <<: *primary_production
    database: <%= ENV.fetch("CABLE_DB_NAME", ENV.fetch("DB_NAME", "harvestpoint_production")) %>
<% end %>
    migrations_paths: db/cable_migrate
