# Configuração recomendada para Nginx como Reverse Proxy com SSL na AWS EC2
# Local padrão no Ubuntu: /etc/nginx/sites-available/harvestpoint

upstream rails_api {
    server 127.0.0.1:80 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.seudominio.com.br;

    # Redireciona HTTP para HTTPS após configurar o Certbot
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://rails_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSocket (ActionCable)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
